<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时光纪念 · TimeDays</title>
  <style>
    :root { --bg: #F7F7F5; --card: #FFFFFF; --ink: #1F242A; --sub: #66707A; --accent: #5B8FB9; --border: #E8E9EC; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121316; --card: #1C1E24; --ink: #F2F4F7; --sub: #9AA2AC; --accent: #78A8CF; --border: #2A2D35; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.7; }
    main { max-width: 680px; margin: 48px auto; padding: 0 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px 28px; }
    h1 { margin: 0 0 8px; font-size: 26px; font-weight: 600; letter-spacing: 0.5px; }
    .subtitle { margin: 0 0 28px; color: var(--sub); font-size: 15px; }
    .links { display: grid; gap: 12px; }
    a.item { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-radius: 14px; background: var(--bg); color: var(--ink); text-decoration: none; font-weight: 500; border: 1px solid var(--border); }
    a.item:hover { border-color: var(--accent); color: var(--accent); }
    footer { text-align: center; color: var(--sub); font-size: 13px; margin-top: 28px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>时光纪念 · TimeDays</h1>
      <p class="subtitle">把牵挂的人与值得期待的日子，轻轻留住。<br />Keep the people and days that matter close.</p>
      <div class="links">
        <a class="item" href="./privacy.html"><span>隐私政策 · Privacy Policy</span><span>→</span></a>
        <a class="item" href="./terms.html"><span>用户协议 · Terms of Use</span><span>→</span></a>
        <a class="item" href="./support.html"><span>技术支持 · Support</span><span>→</span></a>
      </div>
    </div>
    <footer>© 2026 TimeDays · All rights reserved.</footer>
  </main>
</body>
</html>
